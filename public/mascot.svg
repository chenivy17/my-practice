<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 24" shape-rendering="crispEdges" width="20" height="24">
  <!-- 呆毛 -->
  <rect x="8" y="0" width="2" height="1" fill="#5b4334"/>
  <!-- 鮑伯頭頂 -->
  <rect x="6" y="1" width="8" height="1" fill="#5b4334"/>
  <rect x="5" y="2" width="10" height="1" fill="#5b4334"/>
  <rect x="4" y="3" width="12" height="2" fill="#5b4334"/>
  <rect x="3" y="5" width="14" height="1" fill="#5b4334"/>
  <!-- 瀏海 -->
  <rect x="4" y="6" width="12" height="1" fill="#5b4334"/>
  <!-- 臉 -->
  <rect x="5" y="7" width="10" height="9" fill="#f4cda9"/>
  <!-- 中分瀏海垂角 -->
  <rect x="5" y="7" width="2" height="1" fill="#5b4334"/>
  <rect x="13" y="7" width="2" height="1" fill="#5b4334"/>
  <!-- 側髮(鮑伯) -->
  <rect x="3" y="6" width="1" height="10" fill="#5b4334"/>
  <rect x="16" y="6" width="1" height="10" fill="#5b4334"/>
  <rect x="4" y="7" width="1" height="9" fill="#5b4334"/>
  <rect x="15" y="7" width="1" height="9" fill="#5b4334"/>
  <!-- 髮尾內彎 -->
  <rect x="3" y="16" width="3" height="1" fill="#5b4334"/>
  <rect x="14" y="16" width="3" height="1" fill="#5b4334"/>
  <!-- 無奈眉 -->
  <rect x="6" y="8" width="2" height="1" fill="#5b4334"/>
  <rect x="12" y="8" width="2" height="1" fill="#5b4334"/>
  <!-- 眼鏡框 -->
  <rect x="5" y="9" width="4" height="1" fill="#26262b"/>
  <rect x="11" y="9" width="4" height="1" fill="#26262b"/>
  <rect x="5" y="12" width="4" height="1" fill="#26262b"/>
  <rect x="11" y="12" width="4" height="1" fill="#26262b"/>
  <rect x="5" y="10" width="1" height="2" fill="#26262b"/>
  <rect x="8" y="10" width="1" height="2" fill="#26262b"/>
  <rect x="11" y="10" width="1" height="2" fill="#26262b"/>
  <rect x="14" y="10" width="1" height="2" fill="#26262b"/>
  <rect x="9" y="10" width="2" height="1" fill="#26262b"/>
  <!-- 半瞇眼:上眼皮+下半眼珠 -->
  <rect x="6" y="10" width="2" height="1" fill="#e8c9a4"/>
  <rect x="12" y="10" width="2" height="1" fill="#e8c9a4"/>
  <rect x="6" y="11" width="2" height="1" fill="#3a2a1d"/>
  <rect x="12" y="11" width="2" height="1" fill="#3a2a1d"/>
  <rect x="7" y="11" width="1" height="1" fill="#ffffff"/>
  <rect x="13" y="11" width="1" height="1" fill="#ffffff"/>
  <!-- 黑眼圈 -->
  <rect x="6" y="13" width="2" height="1" fill="#d9b28f"/>
  <rect x="12" y="13" width="2" height="1" fill="#d9b28f"/>
  <!-- 腮紅 -->
  <rect x="5" y="13" width="1" height="1" fill="#eba1a8"/>
  <rect x="14" y="13" width="1" height="1" fill="#eba1a8"/>
  <!-- 微張的嘴 -->
  <rect x="9" y="14" width="2" height="1" fill="#bf3b32"/>
  <!-- 脖子 -->
  <rect x="8" y="16" width="4" height="1" fill="#f4cda9"/>
  <!-- 米色大學T -->
  <rect x="6" y="17" width="8" height="1" fill="#e8deca"/>
  <rect x="5" y="18" width="10" height="1" fill="#e8deca"/>
  <rect x="4" y="19" width="12" height="1" fill="#e8deca"/>
  <rect x="3" y="20" width="14" height="4" fill="#e8deca"/>
  <!-- 領口 -->
  <rect x="8" y="17" width="4" height="1" fill="#d3c5a8"/>
  <!-- 項鍊墜子 -->
  <rect x="9" y="19" width="1" height="1" fill="#9aa0a6"/>
